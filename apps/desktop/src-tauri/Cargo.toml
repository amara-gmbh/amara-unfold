[package]
name = "amara-unfold-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Local-first archive inspection for Amara Memory"

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "amara_unfold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amara-unfold-adapters = { path = "../../../crates/adapters" }
amara-unfold-core = { path = "../../../crates/core" }
amara-unfold-db = { path = "../../../crates/db" }
amara-unfold-memory = { path = "../../../crates/memory" }
amara-unfold-scanner = { path = "../../../crates/scanner" }
chrono.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio = { version = "1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }
walkdir.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
