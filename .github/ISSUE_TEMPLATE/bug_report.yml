name: Bug report
description: Report reproducible behavior using synthetic data only
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Never attach real mail, banking, diary, location, media, archive paths, or secrets. Security issues need the private channel described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version and build
      placeholder: 2026.7.19 / 202607191807
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Adapter or surface
      options:
        - Desktop UI
        - CLI
        - Banking
        - Mail
        - Photos/media
        - Maps/location
        - Music/video
        - Diary/travel
        - Build or documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Synthetic reproduction
      description: Give minimal steps and synthetic input structure.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed personal data, absolute private paths, credentials, and private output.
          required: true
